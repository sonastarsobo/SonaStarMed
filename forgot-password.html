<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset password · SOBO</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth">
    <div class="glow" aria-hidden="true"></div>
    <div class="card">
      <div class="auth-head">
        <span class="eyebrow"><span class="logo">S</span> SOBO</span>
        <h1>Forgot or change <em>password</em></h1>
        <p class="sub">
          Enter the e-mail address your account was created with. We will send
          you a link to choose a new password.
        </p>
      </div>
      <form id="f" novalidate>
        <label for="email">E-mail</label
        ><input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
        <div class="row">
          <button class="btn" id="go">Send reset link &rarr;</button>
        </div>
        <div class="msg" id="msg" role="alert"></div>
      </form>
      <div class="foot"><a href="login.html">&larr; Back to sign in</a></div>
    </div>
    <script type="module">
      import { sendPasswordReset } from "./js/auth.js";
      const $ = (id) => document.getElementById(id),
        msg = $("msg");
      $("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = $("email").value.trim();
        if (!/^\S+@\S+\.\S+$/.test(email)) {
          msg.textContent = "Enter a valid e-mail.";
          msg.className = "msg error";
          return;
        }
        $("go").disabled = true;
        msg.className = "msg";
        msg.textContent = "Sending...";
        try {
          await sendPasswordReset(email);
          msg.textContent =
            "If an account uses that e-mail, a reset link is on its way. Check your inbox (and spam folder).";
          msg.className = "msg success";
        } catch (err) {
          console.error(err);
          msg.textContent = err.message;
          msg.className = "msg error";
          $("go").disabled = false;
        }
      });
    </script>
  </body>
</html>
