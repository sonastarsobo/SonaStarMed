<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login · SOBO</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth">
    <div class="glow" aria-hidden="true"></div>
    <div class="card">
      <div class="auth-head">
        <span class="eyebrow"><span class="logo">S</span> SOBO</span>
        <h1>Welcome <em>back</em></h1>
        <p class="sub">Sign in to continue exploring the human body in 3D.</p>
      </div>
      <form id="f" novalidate>
        <label for="email">Username or e-mail</label
        ><input id="email" autocomplete="username" placeholder="Your username or you@example.com" />
        <label for="pw">Password</label
        ><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" />
        <div class="auth-links"><a href="forgot-password.html">Forgot / change password?</a></div>
        <div class="row">
          <button class="btn" id="go">Sign in &rarr;</button>
        </div>
        <div class="msg" id="msg" role="alert"></div>
      </form>
      <div class="foot">New here? <a href="register.html">Create an account</a></div>
    </div>
    <script type="module">
      import { login, getCurrentProfile, homeFor } from "./js/auth.js";
      const $ = (id) => document.getElementById(id),
        msg = $("msg");
      const fail = (t) => ((msg.textContent = t), (msg.className = "msg error"));
      $("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.className = "msg";
        const who = $("email").value.trim(),
          pw = $("pw").value;
        if (!who) return fail("Enter your username or e-mail.");
        if (who.includes("@") && !/^\S+@\S+\.\S+$/.test(who))
          return fail("Enter a valid e-mail.");
        if (!pw) return fail("Enter your password.");
        $("go").disabled = true;
        msg.textContent = "Signing in...";
        try {
          await login(who, pw);
          const p = await getCurrentProfile();
          if (!p)
            throw new Error(
              "Profile not found. Check that schema.sql was run.",
            );
          location.href = homeFor(p.role);
        } catch (err) {
          console.error(err);
          fail(err.message);
          $("go").disabled = false;
        }
      });
    </script>
  </body>
</html>
