<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Launch · SOBO Medical</title>
    <link rel="stylesheet" href="css/global.css" />
    <style>
      body.launch {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--bg);
        text-align: center;
      }
      .launch .glow {
        position: fixed;
        inset: 50% auto auto 50%;
        width: 900px;
        height: 900px;
        transform: translate(-50%, -50%);
        background:
          radial-gradient(circle at 35% 60%, rgba(190, 70, 160, 0.3), transparent 55%),
          radial-gradient(circle at 65% 35%, rgba(130, 90, 220, 0.24), transparent 55%),
          radial-gradient(circle at 50% 50%, rgba(38, 187, 255, 0.12), transparent 60%);
        filter: blur(60px);
        pointer-events: none;
        z-index: 0;
        transition: transform 1.2s var(--ease), opacity 1.2s var(--ease);
      }
      .launch.live .glow {
        transform: translate(-50%, -50%) scale(1.35);
      }
      .stage {
        position: relative;
        z-index: 1;
        padding: 24px 16px;
        width: min(720px, 100%);
      }
      .brandline {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.02em;
        color: var(--ink-2);
      }
      .brandline .logo {
        width: 30px;
        height: 30px;
        font-size: 14px;
      }
      .stage h1 {
        margin: 22px 0 10px;
        font-family: var(--display);
        font-size: clamp(34px, 7vw, 64px);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .stage h1 em {
        font-style: normal;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .stage .sub {
        margin: 0 auto 36px;
        max-width: 480px;
        color: var(--ink-2);
        font-size: clamp(15px, 2.2vw, 18px);
      }

      /* the launch button */
      #go {
        position: relative;
        padding: 18px 44px;
        border-radius: 999px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
        box-shadow: 0 0 0 0 rgba(38, 187, 255, 0.55);
        animation: pulse 2.2s ease-out infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(38, 187, 255, 0.5); }
        70% { box-shadow: 0 0 0 22px rgba(38, 187, 255, 0); }
        100% { box-shadow: 0 0 0 0 rgba(38, 187, 255, 0); }
      }
      .hint {
        margin-top: 16px;
        font-size: 13px;
        color: var(--muted);
      }
      .hint kbd {
        font-family: var(--mono);
        font-size: 12px;
        padding: 1px 6px;
        border: 1px solid var(--line-strong);
        border-radius: 4px;
      }

      /* countdown */
      .count {
        position: relative;
        width: min(300px, 70vw);
        aspect-ratio: 1;
        margin: 0 auto;
        display: grid;
        place-items: center;
      }
      .count svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .count .track {
        fill: none;
        stroke: var(--line-strong);
        stroke-width: 4;
      }
      .count .arc {
        fill: none;
        stroke: url(#ring);
        stroke-width: 6;
        stroke-linecap: round;
      }
      .count b {
        font-family: var(--display);
        font-size: clamp(96px, 22vw, 160px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.04em;
        animation: tick 1s var(--ease);
      }
      @keyframes tick {
        0% { transform: scale(1.6); opacity: 0; filter: blur(8px); }
        35% { transform: scale(1); opacity: 1; filter: blur(0); }
        85% { transform: scale(0.96); opacity: 1; }
        100% { transform: scale(0.8); opacity: 0; }
      }
      .count-label {
        margin-top: 22px;
        font-size: 14px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* live */
      .live-msg h1 {
        animation: rise 0.9s var(--ease) both;
      }
      .live-msg .sub {
        animation: rise 0.9s 0.15s var(--ease) both;
      }
      @keyframes rise {
        from { transform: translateY(18px); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      .flash {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.85), rgba(38, 187, 255, 0.2) 40%, transparent 70%);
        pointer-events: none;
        z-index: 2;
        animation: flash 0.9s ease-out forwards;
      }
      @keyframes flash {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      #burst {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }
      [hidden] {
        display: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        #go,
        .count b,
        .live-msg h1,
        .live-msg .sub {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="launch">
    <div class="glow" aria-hidden="true"></div>
    <canvas id="burst" aria-hidden="true"></canvas>

    <main class="stage" aria-live="polite">
      <section id="ready">
        <span class="brandline"><span class="logo">S</span> SOBO &middot; MEDICAL</span>
        <h1>Explore the human body <em>in 3D</em></h1>
        <p class="sub">Interactive anatomy, quizzes and sprints for medical students.</p>
        <button class="btn" id="go">&#128640; Launch</button>
        <p class="hint">or press <kbd>Enter</kbd></p>
      </section>

      <section id="counting" hidden>
        <div class="count">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#6fa2ff" />
                <stop offset="50%" stop-color="#a98bff" />
                <stop offset="100%" stop-color="#eaa6d9" />
              </linearGradient>
            </defs>
            <circle class="track" cx="50" cy="50" r="46" />
            <circle class="arc" id="arc" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" />
          </svg>
          <b id="num">5</b>
        </div>
        <div class="count-label">Launching SOBO Medical</div>
      </section>

      <section id="live" class="live-msg" hidden>
        <span class="brandline"><span class="logo">S</span> SOBO &middot; MEDICAL</span>
        <h1>We are <em>live!</em></h1>
        <p class="sub">Taking you in&hellip;</p>
      </section>
    </main>

    <script>
      // Launch ceremony: press the button -> 5-second countdown -> "live" burst -> open the website.
      const COUNT_FROM = 5; // seconds
      const ENTER_AFTER_MS = 2600; // how long the "We are live" screen shows before opening the site
      const DESTINATION = "index.html"; // signs in or opens the right dashboard

      const $ = (id) => document.getElementById(id);
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let started = false;

      function start() {
        if (started) return;
        started = true;
        $("ready").hidden = true;
        $("counting").hidden = false;
        const arc = $("arc"),
          num = $("num"),
          t0 = performance.now(),
          total = COUNT_FROM * 1000;
        let shown = COUNT_FROM;
        num.textContent = shown;
        (function frame(now) {
          const left = Math.max(0, total - (now - t0));
          arc.style.strokeDashoffset = String(100 - (left / total) * 100);
          const n = Math.ceil(left / 1000);
          if (n !== shown && n > 0) {
            shown = n;
            num.textContent = n;
            // restart the number's pop-in animation
            num.style.animation = "none";
            void num.offsetWidth;
            num.style.animation = "";
          }
          if (left > 0) requestAnimationFrame(frame);
          else goLive();
        })(t0);
      }

      function goLive() {
        $("counting").hidden = true;
        $("live").hidden = false;
        document.body.classList.add("live");
        if (!reduced) {
          const f = document.createElement("div");
          f.className = "flash";
          document.body.appendChild(f);
          burst();
        }
        setTimeout(() => location.assign(DESTINATION), ENTER_AFTER_MS);
      }

      // Confetti burst from the centre of the screen
      function burst() {
        const c = $("burst"),
          ctx = c.getContext("2d"),
          dpr = Math.min(devicePixelRatio || 1, 2);
        c.width = innerWidth * dpr;
        c.height = innerHeight * dpr;
        ctx.scale(dpr, dpr);
        const colors = ["#26bbff", "#6fa2ff", "#a98bff", "#eaa6d9", "#ffffff", "#3ddc97"];
        const cx = innerWidth / 2,
          cy = innerHeight / 2;
        const bits = Array.from({ length: 160 }, () => {
          const a = Math.random() * Math.PI * 2,
            v = 4 + Math.random() * 10;
          return {
            x: cx,
            y: cy,
            vx: Math.cos(a) * v,
            vy: Math.sin(a) * v - 3,
            r: Math.random() * Math.PI,
            vr: (Math.random() - 0.5) * 0.3,
            w: 5 + Math.random() * 6,
            h: 3 + Math.random() * 4,
            c: colors[(Math.random() * colors.length) | 0],
          };
        });
        const t0 = performance.now();
        (function draw(now) {
          const life = (now - t0) / 2400;
          ctx.clearRect(0, 0, innerWidth, innerHeight);
          ctx.globalAlpha = Math.max(0, 1 - life);
          bits.forEach((b) => {
            b.vy += 0.18;
            b.vx *= 0.99;
            b.x += b.vx;
            b.y += b.vy;
            b.r += b.vr;
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.r);
            ctx.fillStyle = b.c;
            ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
            ctx.restore();
          });
          if (life < 1) requestAnimationFrame(draw);
        })(t0);
      }

      $("go").addEventListener("click", start);
      document.addEventListener("keydown", (e) => {
        if ((e.key === "Enter" || e.key === " ") && e.target === document.body) {
          e.preventDefault();
          start();
        }
      });
      $("go").focus();
    </script>
  </body>
</html>
