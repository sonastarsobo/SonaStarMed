<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>New password · SOBO</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth">
    <div class="glow" aria-hidden="true"></div>
    <div class="card">
      <div class="auth-head">
        <span class="eyebrow"><span class="logo">S</span> SOBO</span>
        <h1>Choose a new <em>password</em></h1>
        <p class="sub" id="sub">Checking your reset link...</p>
      </div>
      <form id="f" novalidate hidden>
        <label for="pw">New password</label
        ><input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
        <label for="pw2">Confirm new password</label
        ><input id="pw2" type="password" autocomplete="new-password" placeholder="Repeat password" />
        <div class="row">
          <button class="btn" id="go">Save password &rarr;</button>
        </div>
      </form>
      <div class="msg" id="msg" role="alert"></div>
      <div class="foot"><a href="login.html">&larr; Back to sign in</a></div>
    </div>
    <script type="module">
      import { supabase } from "./js/supabase.js";
      import { getCurrentProfile, homeFor } from "./js/auth.js";
      const $ = (id) => document.getElementById(id),
        msg = $("msg");
      const ready = () => {
        $("sub").textContent = "Enter your new password below.";
        $("f").hidden = false;
      };
      // The e-mail link signs the browser in with a short-lived recovery session.
      supabase.auth.onAuthStateChange((ev, session) => {
        if (session && (ev === "PASSWORD_RECOVERY" || ev === "SIGNED_IN" || ev === "INITIAL_SESSION")) ready();
      });
      setTimeout(async () => {
        const { data } = await supabase.auth.getSession();
        if (data.session) ready();
        else if ($("f").hidden)
          $("sub").innerHTML =
            'This link is invalid or has expired. <a href="forgot-password.html">Request a new one</a>.';
      }, 1500);
      $("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pw = $("pw").value;
        msg.className = "msg error";
        if (pw.length < 8) return (msg.textContent = "Use at least 8 characters.");
        if (pw !== $("pw2").value) return (msg.textContent = "Passwords do not match.");
        $("go").disabled = true;
        msg.className = "msg";
        msg.textContent = "Saving...";
        const { error } = await supabase.auth.updateUser({ password: pw });
        if (error) {
          msg.className = "msg error";
          msg.textContent = error.message;
          $("go").disabled = false;
          return;
        }
        msg.className = "msg success";
        msg.textContent = "Password changed. Taking you in...";
        const p = await getCurrentProfile();
        setTimeout(() => (location.href = p ? homeFor(p.role) : "login.html"), 900);
      });
    </script>
  </body>
</html>
