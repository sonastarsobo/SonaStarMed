<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Teacher profile · SOBO</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <style>
      .tp-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        align-items: stretch;
        margin-bottom: 16px;
      }
      .tp-grid > .card {
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      .tp-grid .push {
        margin-top: auto;
        align-self: flex-start;
      }
      .tp-stats {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        margin-bottom: 16px;
      }
      .tp-signout {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin: 0;
      }
      .tp-signout h2 {
        margin: 0 0 2px;
      }
      .tp-signout p {
        margin: 0;
      }
      .field select {
        width: 100%;
      }
      @media (max-width: 900px) {
        .tp-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <nav id="nav" class="top"></nav>
    <main class="wide">
      <section class="card profile-hero">
        <div class="big-avatar" id="bigAv">?</div>
        <div style="flex: 1; min-width: 220px">
          <span class="eyebrow-sm">My profile</span>
          <h1 id="pName">Loading...</h1>
          <div class="meta" id="pMeta"></div>
        </div>
      </section>

      <section class="grid tp-stats" id="tpStats"></section>

      <div class="tp-grid">
        <section class="card">
          <h2>Account</h2>
          <div class="field">
            <label for="un">Username</label><input id="un" maxlength="60" autocomplete="off" />
          </div>
          <div class="field">
            <label for="em">E-mail</label><input id="em" disabled />
          </div>
          <div class="field">
            <label for="rl">Role</label>
            <select id="rl">
              <option value="ADMIN">Teacher</option>
              <option value="STUDENT">Student</option>
            </select>
          </div>
          <p class="muted small">Changing your role to Student removes your access to the teacher console.</p>
          <button class="btn push" id="saveAcc">Save changes</button>
        </section>
        <section class="card">
          <h2>Change password</h2>
          <div class="field">
            <label for="pw">New password</label
            ><input id="pw" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" />
          </div>
          <div class="field">
            <label for="pw2">Confirm new password</label
            ><input id="pw2" type="password" minlength="8" autocomplete="new-password" />
          </div>
          <p class="muted small">Use at least 8 characters. You stay signed in on this device after changing it.</p>
          <button class="btn secondary push" id="savePw">Update password</button>
        </section>
      </div>

      <section class="card danger-zone tp-signout">
        <div>
          <h2>Sign out</h2>
          <p class="muted small">Log out of SOBO on this device.</p>
        </div>
        <button class="btn danger" id="logoutBtn">Log out</button>
      </section>
    </main>
    <script type="module">
      import { requireAdmin, $, esc, rpc, mountNav, toast, fmtDay, confirmLogout, confirmBox } from "../js/session.js";
      import { supabase } from "../js/supabase.js";
      const p = await requireAdmin();
      mountNav(p, "profile");
      const initials = (n) =>
        String(n || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
      const paint = () => {
        $("pName").textContent = p.username || p.name;
        $("bigAv").textContent = initials(p.username || p.name);
        $("pMeta").innerHTML =
          `<span class="chip brand">${p.role === "ADMIN" ? "Teacher" : "Student"}</span><span class="chip">${esc(p.email || "")}</span><span class="chip">Member since ${fmtDay(p.created_at)}</span>`;
      };
      paint();
      $("un").value = p.username || p.name || "";
      $("em").value = p.email || "";
      $("rl").value = p.role;

      $("saveAcc").onclick = async () => {
        const username = $("un").value.trim(),
          role = $("rl").value;
        if (!username) return toast("Username cannot be empty", "error");
        if (username === (p.username || p.name) && role === p.role) return toast("Nothing to save");
        if (role !== p.role && role === "STUDENT") {
          const ok = await confirmBox(
            '<h3 style="margin-top:0">Change your role to Student?</h3><p class="muted">You will lose access to the teacher console immediately and can only get it back from another teacher.</p>',
            { ok: "Change role", cancel: "Keep teacher" },
          );
          if (!ok) return;
        }
        const { error } = await supabase.from("profiles").update({ username, name: username, role }).eq("id", p.id);
        if (error)
          return toast(
            /duplicate|unique/i.test(error.message) ? `Username "${username}" is already taken.` : error.message,
            "error",
          );
        toast("Saved", "success");
        if (role !== p.role) return location.replace("../student/dashboard.html");
        p.username = p.name = username;
        paint();
        mountNav(p, "profile");
      };

      $("savePw").onclick = async () => {
        if ($("pw").value.length < 8) return toast("Use at least 8 characters", "error");
        if ($("pw").value !== $("pw2").value) return toast("Passwords do not match", "error");
        const { error } = await supabase.auth.updateUser({ password: $("pw").value });
        if (error) return toast(error.message, "error");
        toast("Password updated", "success");
        $("pw").value = $("pw2").value = "";
      };
      $("logoutBtn").onclick = () => confirmLogout();

      // Quick numbers about the course (best effort; the page works without them)
      rpc("admin_overview")
        .then((o) => {
          const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
          $("tpStats").innerHTML =
            stat(o.students, "Students") +
            stat(o.active_users_7d, "Active this week") +
            stat(`${o.quizzes.published} / ${o.quizzes.total}`, "Quizzes published") +
            stat(o.questions.total, "Questions in bank") +
            stat(o.attempts.total, "Attempts");
        })
        .catch((e) => console.warn("overview unavailable", e));
    </script>
  </body>
</html>
